<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortFolio</title>
</head>
<body>
    <style>
        *{
            margin:0;
            padding:0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body{
            background-color:black;
            color:white;
        }
        .gradient-image{
            position:absolute;
            top:0;
            right:0;
            z-index:-1;
        }
        .glow{
            width:30rem;
            height:0;
            position:absolute;
            top:20%;
            right:0;
            box-shadow: 0 0 700px 20px white;
            rotate: -30deg;
            z-index:-1;
        }
        .container{
            width:100%;
            margin: 0 auto;
            padding: 0 2rem;
            position:relative;
            
        }
        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:1rem 5rem;
        }
        header h1{
            margin:0;
            font-weight:300;
            font-size:3rem;
        }
        nav{
            display:flex;
            align-items:center;
            gap:3rem;
            margin-left:-5%;
            z-index:999;
        }
        nav a{
            font-size:1rem;
            letter-spacing: 0.1rem;
            transition-property: all;
            transition-duration: 0.2s;
            transition-timing-function: ease;
            color:inherit;
            text-decoration:none;
        }
        nav a:hover{
            color:#a7a7a7;
        }
        .btn-hire{
            background-color:#a7a7a7;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            border:none;
            font-size:1rem;
            font-weight: 500;
            transition-property: all;
            transition-duration:0.2s;
            transition-timing-function: ease;
            cursor: pointer;
            z-index:999;
        }
        .btn-hire:hover{
            background-color:aqua;
        }
        main{
            display:flex;
            flex-direction:column;
            justify-content: center;
            min-height: calc(50vh - 6rem);
        }

        .content{
            max-width: 40rem;
            margin-left:10%;
            z-index:999;
        }

        .tag-box{
            position:relative;
            width: 18rem;
            height: 2.5rem; 
            border-radius: 50px;
            background:liner-gradient(to right, #656565, #7f42a7, #6600c5 
            #5300a0, #757575, #656565);
            background-size: 200%; 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            
        }

        .tag-box .tag{
            position:absolute;
            inset: 3px 3px 3px 3px;
            background-color:black;
            border-radius:50px;
            display:flex;
            
            align-items:center;
            justify-content: center;
            transition: 0.5s ease;
            cursor:pointer;
        }

        .tag-box .tag:hover{
            color: #5300a0;
        }
        .content h1{
            font-size:rem;
            font-weight:600;
            letter-spacing: 0.1rem;
            margin: 2rem 0;
            line-height: 1.2;
            text-shadow:0 0 10px gray;
        }

        .description{
            font-size:1.2rem;
            letter-spacing: 0.05rem;
            max-width:35rem;
            color:gray;
        }

        .buttons{
            display:flex;
            gap: 1rem;
            margin-top:3rem;
            cursor: pointer;
        }

        .btn-git{
            text-decoration:none;
            border:1px solid #2a2a2a;
            padding: 0.7rem 1.2rem;
            border-radius: 50px;
            font-weight:600;
            font-size: 1.2rem;
            letter-spacing: 0.1rem;
            transition: background-color 0.2s ease;
        }

        .btn-git:hover{
            background-color: #1a1a1a;
        }

        .resume{
            text-decoration:none;
            background-color:lightgray;
            color:black;
            padding: 0.6rem 2.5rem;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.1rem;
            transition: background-color 0.2s ease;
        }

        .resume:hover{
            background-color:gray;
        }
        .model{
            position:absolute;
            top:0;
            right:0;
        }

        @media(max-width:1300px){
            header{
                padding: 1rem 0.5rem;
            }
        }
        @media(max-width:768px){
            header{
                padding: 1rem 0.1rem;
            }
        }
    </style>
    <img src="gradient.png" alt="gradient-image" class="gradient-image">
    <div class="glow"></div>
    <div class="container">
        <header>
            <h1 class="name">VinayKumar</h1>
            <nav>
                <a href="">SKILLS</a>
                <a href="">EDUCATION</a>
                <a href="projects.html">PROJECTS</a>
                <a href="">EXPERIENCE</a>
            </nav>
            <button class="btn-hire">HIRE</button>
        </header>

        <main>
        <div class="content">
            <div class="tag-box">
                <div class="tag">
                    INTRODUCTION &wedbar;
                </div>
                <h1><br><br> I am a WEB-DEVELOPER</h1>
                <p class="description">
                    I am an undergraduate student, in the domain of
                    CYBERSECURITY. I am an influencer too,
                    who barely overcomes procrastrination and make videos.
                    Finally I love music.
                </p>

                <div class="buttons">
                    <a href="https://github.com/vinay-kumar-0" class="btn-git">GitHub</a>
                    <a href="https://www.linkedin.com/in/vinay-kumar-9261ab2b3/" class="resume">LINKEDIN</a>

                </div>
            </div>
        </div>
        </main>
    </div>
    <script type="module" src="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js">

    </script>
<spline-viewer class="model" url="https://prod.spline.design/PBQQBw8bfXDhBo7w/scene.splinecode" events-target="global"></spline-viewer>
</body>
</html>
